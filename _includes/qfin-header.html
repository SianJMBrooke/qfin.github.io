<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap">
<link rel="stylesheet" href="{{ '/assets/css/custom.css' | relative_url }}?v={{ site.time | date: '%s' }}">

<!-- Logo, the same on every page -->
<div class="qfin-banner-wrap">
  {% if include.home %}
  <img src="{{ '/assets/images/qfin-logo-static.jpg' | relative_url }}" alt="QFIN - Queer and Feminist Informatics Network" class="qfin-banner">
  {% else %}
  <a href="{{ '/' | relative_url }}" class="qfin-banner-link"><img src="{{ '/assets/images/qfin-logo-static.jpg' | relative_url }}" alt="QFIN home" class="qfin-banner"></a>
  {% endif %}
</div>

<!-- Site navigation -->
<nav class="qfin-nav" aria-label="Main">
  {% for item in site.nav %}
    {% assign item_url = item.url | relative_url %}
    {% assign page_url = page.url | relative_url %}
    <a href="{{ item_url }}"{% if page_url == item_url %} class="is-active" aria-current="page"{% endif %}>{{ item.title }}</a>
  {% endfor %}
</nav>
