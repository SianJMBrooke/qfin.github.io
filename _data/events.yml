
- title: "QFIN Launch Event"
  date: 2026-04-24
  time: "15:00–18:30"
  location: "Amsterdam Science Park, L1.01"
  description: "Join us for the launch of the Queer & Feminist Informatics Network. Exploring how queer & feminist practices can reshape informatics, AI, and digital technologies. Open to students, staff, researchers, artists, activists — anyone curious about queer & feminist informatics."
  signup_url: "https://docs.google.com/forms/d/e/1FAIpQLSerwAJxJ1O9xtXG_W3h_HFalRbRg0HU8WUxzQk7fvt6EAy6tg/viewform"
  poster_url: "https://docs.google.com/forms/d/e/1FAIpQLSfSbfE5ghMOGCApphsUIQ0ihtTueou7Gdhth1ui0OtzmGM0YA/viewform"
  schedule:
    - time: "15:00–16:00"
      room: "L1.01"
      title: "Keynote — Dr Kay Kender (they/them): Datafied Blockbusterisation"
      description: "The structures and design characteristics of platformed cultural production are geared towards Blockbusterisation: making that which is popular with the largest audience more and more prominent, while increasingly obscuring marginalised expressions. This keynote discusses three case studies of Blockbusterisation in the context of data-driven technologies: GenAI, 3D-model databases, and social media."
    - time: "16:15–17:15"
      room: "L1.04, L1.07, L1.08"
      title: "3 Parallel Hands-on Workshops"
      workshops:
        - title: "Don't Worry Mum, ChatGPT Says I'll Be Fine"
          description: "How LLMs, web search, and 'no tools' shape what AI know about queer rights."
        - title: "Face/Off: Adversarial Drag in the Age of Capture"
          description: "Drag and adversarial makeup, and gender fuckery against facial surveillance."
        - title: "Worn Otherwise: Designing Something Queerly"
          description: "Speculative futures of wearables and AI through queer/crip design."
    - time: "17:25–18:30"
      room: "L1.01"
      title: "Community Poster Session"
      description: "Want to submit a community poster? Optional, deadline April 17."

- title: "QFIN Autumn Open Event"
  date: 2026-11-04
  time: "15:00–18:30"
  location: "LAB42, Amsterdam Science Park"
  description: "Bring a project to share, explore ideas with others, or simply come along to meet the community. Everyone is welcome, whether you're sharing work or just coming along."
  signup_url: "https://uva.fra1.qualtrics.com/jfe/form/SV_8nUi1XFrP543cjk"
  schedule:
    - time: "15:00–16:00"
      room: "L1.12 & L1.17"
      title: "Formally Joining QFIN Ranks (optional)"
      description: "Interested in a Working Group Chair or Member, Community Representative, or Project Volunteer role? Complete the involvement survey (https://uva.fra1.qualtrics.com/jfe/form/SV_e9HsduKt2iEbJkO) if you haven't already, then join this interactive session about the roles, QFIN's organisation, and next steps. You're welcome to join from 16:00 without taking on a formal role."
    - time: "16:00–17:30"
      room: "L1.12 & L1.17"
      title: "Out on the Wall: Community Poster Session"
      description: "Share a finished or work-in-progress research project, artistic experiment, or speculative idea related to queerness, feminism, and technology. No selection process. Bring a printed poster, or email your file (max A2) to qfin-science@uva.nl by 26 October and we'll print it for you. Handmade and interactive work is welcome too."
    - time: "16:00–17:30"
      room: "L1.12 & L1.17"
      title: "Queering the Table: Rotating Discussion Tables"
      description: "Short rounds of conversation at small themed tables, switching between rounds. No preparation or expertise needed, just bring a question or your curiosity."
    - time: "17:30–18:30"
      room: "L1.12 & L1.17"
      title: "Informal Borrel"
      description: "Stay for snacks and informal conversation."