# Photos shown as 1998-style pop-up windows in a row, one set per page.
# Add a set to a page with {% include popup-gallery.html set="about" %}
# (the home page uses "home").
#
# polaroid: true  gives the window a dark viewer background, for the
#                 cut-out polaroids with transparent corners.
# credit:         shown in a second pane of the status bar.
#
# Photos have had their location data removed. Only add photos that people
# in them have agreed to.

home:
  - file: "/assets/images/launch/launch-atrium.jpg"
    title: "atrium.jpg"
    caption: "Setting up in the Lab42 atrium"
    alt: "Round tables with black tablecloths set out in the Lab42 atrium, with a green plant wall behind"

  - file: "/assets/images/launch/launch-vulvas.jpg"
    title: "vulvas.jpg"
    caption: "Rainbow 3D-printed vulvas"
    alt: "Rainbow-coloured 3D-printed vulvas scattered on a black tablecloth"

  - file: "/assets/images/launch/launch-stickers.jpg"
    title: "stickers.bmp"
    caption: "Stickers and badges"
    alt: "A hand holding a red tube next to QFIN stickers and badges on a black tablecloth"

  - file: "/assets/images/launch/launch-catering.jpg"
    title: "borrel.jpg"
    caption: "Snacks for the borrel"
    alt: "Platters of sandwiches and vegetables on a table"

  - file: "/assets/images/launch/launch-lab42.jpg"
    title: "lab42_from_above.jpg"
    caption: "Lab42 from the top floor"
    alt: "The Lab42 atrium seen from an upper floor, with tables and plants below"

