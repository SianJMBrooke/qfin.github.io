title: "Queer and Feminist Informatics Network"
description: "The Queer and Feminist Informatics Network (QFIN) is an open, inclusive network for queer and feminist approaches to computing, broadening participation in computing education and research."
qfin_logo: "/assets/images/qfin-logo-banner.png"
baseurl: ""
url: "https://www.qfinformatics.com"

title_color: "#ffffff"
title_gradient_blue: "#00e5ff"
title_gradient_pink: "#ff2d9b"

remote_theme: pages-themes/cayman@v0.2.0
plugins:
  - jekyll-remote-theme

dilab_logo: "/assets/images/dilab-logo-white.png"

markdown: kramdown
kramdown:
  input: GFM

exclude:
  - README.md
  - tools

# ------------------------------------------------------------
# QFIN settings
# Change these here and every page updates.
# ------------------------------------------------------------

# Shared mailbox, used as the main contact address
contact_email: "qfin-science@uva.nl"

# Mailing list (list.uva.nl)
mailing_list_address: "qfin@list.uva.nl"
# Public list page on list.uva.nl. Anyone can subscribe there with just
# an email address, no UvA account needed.
mailing_list_subscribe_url: "https://list.uva.nl/postorius/lists/qfin.list.uva.nl/"

# Live announcements on the homepage. Paste the Web app URL of the Apps Script
# in the qfinformatics@gmail.com account here (see tools/announcements-feed.gs).
# Leave empty to use _data/announcements.yml instead.
announcements_feed_url: "https://script.google.com/macros/s/AKfycbyu1RxY2F6rbkX5Kn70771VNi9wNvHLdHsJAZQbgRoktq0B3qw14qlc2QfhRPA9wqgk/exec"

# Public QFIN events calendar (the qfinformatics@gmail.com Google account).
# The calendar must be set to public in Google Calendar > Settings and sharing.
# google_calendar_id: the Calendar ID from "Integrate calendar"
# google_calendar_add_url: Google's share link, used for "Add to Google Calendar"
google_calendar_id: "qfinformatics@gmail.com"
google_calendar_add_url: "https://calendar.google.com/calendar/u/0?cid=cWZpbmZvcm1hdGljc0BnbWFpbC5jb20"

# Survey for people who want to take on a role
involvement_survey_url: "https://uva.fra1.qualtrics.com/jfe/form/SV_e9HsduKt2iEbJkO"

linkedin_url: "https://www.linkedin.com/company/qfin-uva/"
# Paste the full Instagram profile link here (e.g. https://www.instagram.com/handle/).
# Links appear on the site automatically once this is filled in.
instagram_url: "https://www.instagram.com/qfinscience/"

# Work with us page. Leave empty to use a pre-filled email to contact_email,
# or paste a form link (e.g. a Google Form) to use that instead.
workshop_request_url: ""
sponsor_url: ""

# Top navigation
nav:
  - title: "Home"
    url: "/"
  - title: "About"
    url: "/about/"
  - title: "Events"
    url: "/events/"
  - title: "Committee"
    url: "/committee/"
  - title: "Work with us"
    url: "/work-with-us/"
  - title: "Publications"
    url: "/publications/"
  - title: "Get involved"
    url: "/get-involved/"
