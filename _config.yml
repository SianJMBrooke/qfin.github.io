title: "Queer and Feminist Informatics Network"
description: "The Queer and Feminist Informatics Network (QFin) is an open, inclusive network embedded in the Digital Interactions Lab (DILab) at the Informatics Institute (IvI), University of Amsterdam."
qfin_logo: "/assets/images/qfin-logo-banner.png"
baseurl: ""
url: "https://www.qfinformatics.com"

title_color: "#ffffff"
title_gradient_blue: "#00e5ff"
title_gradient_pink: "#ff2d9b"

remote_theme: pages-themes/cayman@v0.2.0
plugins:
  - jekyll-remote-theme

dilab_logo: "/assets/images/dilab-logo-white.png"

markdown: kramdown
kramdown:
  input: GFM

exclude:
  - README.md

